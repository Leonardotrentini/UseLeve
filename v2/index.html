<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UseLeve — Peças Lisas de Alta Qualidade</title>
<meta name="description" content="Peças lisas de alta qualidade direto da fábrica. Preço justo, qualidade garantida.">
<meta name="theme-color" content="#F4EDE4">
<meta name="color-scheme" content="light">

<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #F4EDE4;
    --text: #2A3C2A;
    --text-soft: #4A5A4A;
    --gold: #B8973A;
    --cta-bg: #2A3C2A;
    --cta-text: #F4EDE4;
    --font-display: Georgia, "Times New Roman", Times, serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 32px 28px;
    text-align: center;
    position: relative;
  }

  .logo {
    width: 96px;
    height: 96px;
    display: block;
    margin-bottom: 36px;
    color: #2A2A2A;
  }

  .rule {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin-bottom: 36px;
  }

  .headline {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(1.65rem, 7vw, 2.6rem);
    line-height: 1.25;
    letter-spacing: 0.01em;
    color: var(--text);
    max-width: 380px;
    margin-bottom: 20px;
    text-wrap: balance;
  }

  .headline .accent {
    color: var(--gold);
  }

  .sub {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: clamp(0.88rem, 3.6vw, 1rem);
    line-height: 1.65;
    color: var(--text-soft);
    max-width: 340px;
    margin-bottom: 40px;
  }

  .sub strong {
    font-weight: 600;
    color: var(--text);
  }

  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--cta-text);
    background: var(--cta-bg);
    padding: 16px 44px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  .cta svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .cta:hover {
    background: #1E2D1E;
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(42, 60, 42, 0.18);
  }

  .cta:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(42, 60, 42, 0.12);
  }

  .cta:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  .trust {
    position: absolute;
    bottom: max(24px, env(safe-area-inset-bottom, 24px));
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-soft);
  }

  .trust span {
    margin: 0 8px;
    opacity: 0.4;
  }

  @supports (padding-top: env(safe-area-inset-top)) {
    .page {
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>

<script>

    function loadPixel() {
      if (window.fbq) return;
      var n = window.fbq = function () {
