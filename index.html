<style>
  *, *::before, *::after {

    padding: 0;

  :root {
    --bg: #F4EDE4;

  html, body {

    background: var(--bg);
    color: var(--text);

  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    padding: 32px 28px;
    text-align: center;
    position: relative;
  }

  /* ── Logo ── */
  .logo {
    width: 96px;
    height: 96px;
    object-fit: contain;
    display: block;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards;
  }

  /* ── Divider ── */
  .rule {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.15s forwards;
  }

  /* ── Headline ── */
  .headline {
    font-family: 'Italiana', serif;
    font-weight: 400;
    font-size: clamp(1.65rem, 7vw, 2.6rem);
    line-height: 1.25;
    letter-spacing: 0.01em;
    color: var(--text);
    max-width: 380px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.3s forwards;
  }

  .headline .accent {
    color: var(--gold);
  }

  /* ── Subheadline ── */
  .sub {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: clamp(0.88rem, 3.6vw, 1rem);
    line-height: 1.65;
    color: var(--text-soft);
    max-width: 340px;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.45s forwards;
  }

  .sub strong {
    font-weight: 500;
    color: var(--text);
  }

  /* ── CTA ── */
  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--cta-text);
    background: var(--cta-bg);
    padding: 16px 44px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    opacity: 0;
    animation: fadeIn 0.8s ease 0.6s forwards;
  }

  .cta svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    opacity: 0.85;
  }

  .cta:hover {
    background: #1E2D1E;
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(42, 60, 42, 0.18);
  }

  .cta:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(42, 60, 42, 0.12);
  }

  /* ── Trust ── */
  .trust {
    position: absolute;
    bottom: max(24px, env(safe-area-inset-bottom, 24px));
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-soft);
    opacity: 0;
    animation: fadeIn 0.8s ease 0.75s forwards;
  }

  .trust span {
    margin: 0 8px;
    opacity: 0.3;
  }

  /* ── Animation ── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }

  /* ── Safe area ── */
  @supports (padding-top: env(safe-area-inset-top)) {
    .page {
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
    }
  }
